<soho-icons-new></soho-icons-new>
<soho-icons-empty-new></soho-icons-empty-new>

<div
  soho-busyindicator
  [activated]="isBusy()"
  [blockUI]="true"
  [displayDelay]="0"
  [style.padding.rem]="4"
>
  <div class="row card top-padding" [style.height.%]="100">
    <div class="form-responsive row">
      <div class="six columns">
        <div class="field">
          <h1>User context</h1>
          <p>
            Click Load to fetch your M3 user context. The "current" values
            reflect any overrides active in H5 (e.g. a changed company).
          </p>
        </div>
        <button soho-button="primary" (click)="onClickLoad()">Load</button>
      </div>
    </div>

    <div class="form-responsive row top-padding">
      <div class="six columns">
        <div class="field">
          <label for="di-cono">Company</label>
          <input id="di-cono" [value]="company()" readonly />
        </div>
      </div>
      <div class="six columns">
        <div class="field">
          <label for="di-ccono">Current company</label>
          <input id="di-ccono" [value]="currentCompany()" readonly />
        </div>
      </div>
    </div>

    <div class="form-responsive row">
      <div class="six columns">
        <div class="field">
          <label for="di-divi">Division</label>
          <input id="di-divi" [value]="division()" readonly />
        </div>
      </div>
      <div class="six columns">
        <div class="field">
          <label for="di-cdivi">Current division</label>
          <input id="di-cdivi" [value]="currentDivision()" readonly />
        </div>
      </div>
    </div>

    <div class="form-responsive row">
      <div class="six columns">
        <div class="field">
          <label for="di-lang">Language</label>
          <input id="di-lang" [value]="language()" readonly />
        </div>
      </div>
      <div class="six columns">
        <div class="field">
          <label for="di-clang">Current language</label>
          <input id="di-clang" [value]="currentLanguage()" readonly />
        </div>
      </div>
    </div>
  </div>
</div>
